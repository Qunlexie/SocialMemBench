<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SocialMemBench Viewer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z"/>
      </svg>
      <span class="header-title">SocialMemBench</span>
      <span class="header-subtitle">Data Viewer</span>
    </div>
    <div class="header-meta" id="header-meta"></div>
  </header>

  <div class="layout">
    <!-- Sidebar: network list -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-label">Networks</span>
        <button class="btn-icon" id="refresh-btn" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
      <div class="network-list" id="network-list">
        <div class="empty-state">
          <div class="empty-icon">◌</div>
          <div class="empty-text">Loading…</div>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <!-- Empty / welcome state -->
      <div class="welcome" id="welcome">
        <div class="welcome-inner">
          <div class="welcome-icon">
            <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="32" cy="32" r="28"/>
              <circle cx="20" cy="26" r="6"/>
              <circle cx="44" cy="26" r="6"/>
              <circle cx="32" cy="44" r="6"/>
              <line x1="26" y1="26" x2="38" y2="26"/>
              <line x1="22" y1="31" x2="30" y2="39"/>
              <line x1="42" y1="31" x2="34" y2="39"/>
            </svg>
          </div>
          <h2 class="welcome-title">Select a network</h2>
          <p class="welcome-desc">Choose a network from the sidebar to inspect its conversations, social graph, and QA pairs.</p>
          <div class="welcome-hint" id="welcome-hint"></div>
        </div>
      </div>

      <!-- Network detail view (hidden until selection) -->
      <div class="network-view" id="network-view" style="display:none">
        <!-- Network title bar -->
        <div class="network-titlebar">
          <div class="network-title-info">
            <h1 class="network-name" id="network-name">—</h1>
            <div class="network-badges" id="network-badges"></div>
          </div>
          <div class="tab-bar">
            <button class="tab active" data-tab="chat">
              <svg viewBox="0 0 20 20" fill="currentColor">
                <path d="M2 5a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2H6l-4 4V5z"/>
              </svg>
              Chat
            </button>
            <button class="tab" data-tab="graph">
              <svg viewBox="0 0 20 20" fill="currentColor">
                <circle cx="5" cy="10" r="2.5"/><circle cx="15" cy="5" r="2.5"/><circle cx="15" cy="15" r="2.5"/>
                <line x1="7" y1="9" x2="13" y2="6" stroke="currentColor" stroke-width="1.5"/>
                <line x1="7" y1="11" x2="13" y2="14" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              Graph
            </button>
            <button class="tab" data-tab="qa">
              <svg viewBox="0 0 20 20" fill="currentColor">
                <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/>
                <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/>
              </svg>
              QA Pairs
            </button>
          </div>
        </div>

        <!-- Tab panels -->
        <div class="tab-panel active" id="panel-chat">
          <div class="chat-container" id="chat-container">
            <div class="loading-state">Loading conversations…</div>
          </div>
        </div>

        <div class="tab-panel" id="panel-graph">
          <div class="graph-layout">
            <div class="graph-canvas-wrap">
              <svg id="graph-svg"></svg>
            </div>
            <div class="graph-detail" id="graph-detail">
              <div class="detail-empty">
                <p>Click a <strong>node</strong> to see persona details.</p>
                <p>Click an <strong>edge</strong> to see relationship details.</p>
              </div>
            </div>
          </div>
        </div>

        <div class="tab-panel" id="panel-qa">
          <div class="qa-toolbar">
            <div class="qa-filters" id="qa-filters"></div>
            <div class="qa-count" id="qa-count"></div>
          </div>
          <div class="qa-list" id="qa-list">
            <div class="loading-state">Loading QA pairs…</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- D3 (local bundle) -->
  <script src="/static/d3.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
